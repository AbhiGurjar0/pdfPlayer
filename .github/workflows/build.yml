name: Build APK
on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - run: pip install "flet==1.0.5" "flet-cli==1.0.5"

      - name: Restore keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > upload.jks

      - name: Build APK
        env:
          FLET_ANDROID_SIGNING_KEY_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          FLET_ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          yes | flet build apk --verbose --build-number ${{ github.run_number }} 2>&1 | tee build.log
          exit ${PIPESTATUS[1]}

      - name: Show real error
        if: failure()
        run: |
          grep -n -i -E "what went wrong|execution failed|FAILURE|keystore|signing|error:|exception" build.log | head -40